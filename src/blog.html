<!doctype html>
<html lang="lt">
<head>
	<meta charset="utf-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1"/>
	<title>VOID</title>
	<link rel="stylesheet" href="/blog.css"/>
</head>
<body>
<header class="site-header">
	<div></div>
	<div class="brand">
		<a href="/" id="homeLink" class="brand-link">void</a>
	</div>
	<nav class="theme-controls" aria-label="Theme">
		<button class="theme-btn" id="toLight" title="Light mode"
				aria-label="Switch to light mode">
			<span class="icon" aria-hidden="true">☀︎</span>
		</button>
		<button class="theme-btn" id="toDark" title="Dark mode" aria-label="Switch to dark mode">
			<span class="icon" aria-hidden="true">☾</span>
		</button>
	</nav>
</header>

<main id="app" class="app">
	<h1 class="list-title">Naujausi įrašai</h1>

	<section id="list-view" class="list-view">
		<article class="post-card">
			<a href="/post-one" class="post-link" data-post="post-one">
				<h2 class="post-title">Serving atomic styles well</h2>
				<p class="post-sub">Strategies for shipping atomic CSS for websites large and small</p>
				<time class="post-date">2025-09-16</time>
			</a>
		</article>

		<article class="post-card">
			<a href="/second-post" class="post-link" data-post="second-post">
				<h2 class="post-title">Either, Tailwind is CSS‑in‑JS…</h2>
				<p class="post-sub">…or, StyleX isn’t</p>
				<time class="post-date">2025-09-14</time>
			</a>
		</article>

	</section>

	<section id="detail-view" class="detail-view" hidden>

	</section>
</main>
<script src="/bundle.js" defer></script>
</body>
</html>
